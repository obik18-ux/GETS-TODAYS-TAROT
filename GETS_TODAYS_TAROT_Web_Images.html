<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHIN-TAROTOTO 13枚カード・スマホ版</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-width: 0;
    background: #f5f5f5;
    overflow-x: hidden;
}

#frame {
    display: block;
    width: 100%;
    min-width: 0;
    border: 0;
    margin: 0;
    padding: 0;
}
</style>
</head>

<body>

<iframe
    id="frame"
    src="13%E6%9E%9A%E3%82%AB%E3%83%BC%E3%83%89%E8%A1%A8%E7%A4%BA%E7%89%88.html"
    frameborder="0"
    scrolling="no">
</iframe>

<script>

const frame = document.getElementById("frame");

frame.onload = function () {

    const doc = frame.contentDocument;

    if (!doc) return;


    /* =========================================
       スタイル設定
       ========================================= */

    const style = doc.createElement("style");

    style.innerHTML = `

    html {
        width: 100% !important;
        min-width: 0 !important;
        overflow-x: hidden !important;
    }

    body {
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important;

        margin: 0 !important;
        padding: 8px !important;

        box-sizing: border-box !important;

        overflow-x: hidden !important;
    }


    /* =========================================
       カードを引くボタン
       ========================================= */

    button,
    input[type="button"],
    input[type="submit"] {

        font-size: 28px !important;

        font-weight: bold !important;

        padding: 18px 34px !important;

        min-height: 70px !important;

        border-radius: 10px !important;

        box-sizing: border-box !important;
    }


    /* =========================================
       13枚カード
       ========================================= */

    #board,
    .board {

        display: grid !important;

        grid-template-columns:
            repeat(3, minmax(0, 1fr)) !important;

        width: 100% !important;

        min-width: 0 !important;

        max-width: 100% !important;

        margin: 0 auto !important;

        padding: 0 !important;

        gap: 10px !important;

        box-sizing: border-box !important;

        overflow: visible !important;
    }


    #board > *,
    .board > * {

        display: block !important;

        width: 100% !important;

        min-width: 0 !important;

        max-width: 100% !important;

        margin: 0 !important;

        padding: 0 !important;

        box-sizing: border-box !important;
    }


    /* =========================================
       カード画像
       ========================================= */

    #board img,
    .board img {

        display: block !important;

        width: 100% !important;

        max-width: 100% !important;

        height: auto !important;

        margin: 0 auto !important;

        box-sizing: border-box !important;
    }


    /* =========================================
       カード名
       ========================================= */

    #board .name,
    #board .card-name,
    .board .name,
    .board .card-name {

        display: block !important;

        width: 100% !important;

        margin-top: 4px !important;

        font-size: 12px !important;

        line-height: 1.3 !important;

        font-weight: bold !important;

        text-align: center !important;

        word-break: break-word !important;

        box-sizing: border-box !important;
    }


    /* =========================================
       正位置・逆位置
       ========================================= */

    #board .orientation,
    .board .orientation {

        display: block !important;

        width: 100% !important;

        margin-top: 2px !important;

        font-size: 11px !important;

        line-height: 1.3 !important;

        text-align: center !important;

        box-sizing: border-box !important;
    }


    /* =========================================
       勝（1）・負（2）・分（0）
       ========================================= */

    #board .result,
    .board .result {

        display: block !important;

        width: 100% !important;

        margin: 6px 0 10px 0 !important;

        padding: 8px 2px !important;

        font-size: 30px !important;

        line-height: 1.25 !important;

        font-weight: 900 !important;

        text-align: center !important;

        white-space: nowrap !important;

        border: 2px solid #555 !important;

        border-radius: 8px !important;

        background: #ffffff !important;

        box-sizing: border-box !important;
    }


    /* =========================================
       「判定」を含む要素を非表示
       ========================================= */

    .judgment,
    .判定,
    [class*="judgment"],
    [id*="judgment"] {

        display: none !important;
    }


    /* =========================================
       小さいスマートフォン
       ========================================= */

    @media (max-width: 380px) {

        #board,
        .board {

            grid-template-columns:
                repeat(2, minmax(0, 1fr)) !important;

            gap: 8px !important;
        }

        button,
        input[type="button"],
        input[type="submit"] {

            font-size: 26px !important;

            padding: 16px 28px !important;

            min-height: 64px !important;
        }

        #board .result,
        .board .result {

            font-size: 27px !important;

            padding: 7px 2px !important;
        }
    }

    `;

    doc.head.appendChild(style);


    /* =========================================
       「判定」という文字を含む要素を
       親要素ごと確認して削除
       ========================================= */

    function removeJudgmentText() {

        const elements = doc.querySelectorAll("body *");

        elements.forEach(function(el) {

            /* カード結果そのものは触らない */
            if (
                el.classList.contains("result") ||
                el.closest(".result")
            ) {
                return;
            }

            const text = el.textContent.trim();

            if (
                text === "判定" ||
                text === "判定：" ||
                text === "判定:"
            ) {

                el.remove();

            }

        });

    }


    /* 最初に実行 */
    removeJudgmentText();


    /* 少し時間を置いて再確認 */
    setTimeout(removeJudgmentText, 300);
    setTimeout(removeJudgmentText, 1000);
    setTimeout(removeJudgmentText, 2000);


    /* =========================================
       iframeの高さ
       ========================================= */

    function resizeFrame() {

        try {

            const height =
                Math.max(
                    doc.body.scrollHeight,
                    doc.documentElement.scrollHeight
                );

            frame.style.height = height + "px";

        } catch(e) {

            frame.style.height = "3000px";

        }

    }


    setTimeout(resizeFrame, 300);
    setTimeout(resizeFrame, 1000);
    setTimeout(resizeFrame, 2000);
    setTimeout(resizeFrame, 4000);

    window.addEventListener("resize", resizeFrame);

};

</script>

</body>
</html>
