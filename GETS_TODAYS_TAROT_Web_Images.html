<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SHIN-TAROTOTO 13枚カード</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #f4efe5;
    color: #222;
    font-family: "Yu Gothic","Meiryo",sans-serif;
}

header {
    background: #202020;
    color: white;
    text-align: center;
    padding: 18px 10px;
    border-bottom: 4px solid #c9972b;
}

h1 {
    margin: 0;
    font-size: 34px;
    letter-spacing: 2px;
}

header p {
    margin: 6px 0 0;
}

main {
    width: 100%;
    max-width: 1400px;
    margin: auto;
    padding: 15px;
}

.panel {
    background: #fffdf8;
    border: 1px solid #d8ccb4;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
}

.controls {
    text-align: center;
    margin: 10px 0 15px;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 18px 35px;
    background: #e0a52b;
    color: white;
    font-weight: 900;
    font-size: 30px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

.status {
    text-align: center;
    font-weight: bold;
    margin-bottom: 10px;
}

/* =========================================
   13枚カード
========================================= */

.board {
    display: grid;
    grid-template-columns: repeat(13, 92px);
    gap: 10px;
    justify-content: center;
}

.slot {
    text-align: center;
}

.match {
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 5px;
}

.card-frame {
    width: 92px;
    height: 158px;
    background: #272727;
    border: 3px solid #333;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 4px 9px rgba(0,0,0,.25);
}

.card-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform-origin: center center;
}

.card-frame.back img {
    visibility: hidden;
}

.card-frame.back:before {
    content: "T";
    position: absolute;
    inset: 6px;
    border: 2px solid #d6b65d;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #d6b65d;
    font: 700 42px Georgia;
    background:
        repeating-linear-gradient(
            45deg,
            #3d1717,
            #3d1717 8px,
            #501e1e 8px,
            #501e1e 16px
        );
}

.card-name {
    font-size: 13px;
    font-weight: bold;
    line-height: 1.25;
    margin-top: 6px;
}

.orientation {
    font-size: 12px;
    color: #777;
}

/* =========================================
   勝・負・分
   ここには「判定」は存在しません
========================================= */

.result {
    margin-top: 7px;
    font-size: 30px;
    line-height: 1.25;
    font-weight: 900;
}

.result.win {
    color: #0b6b36;
}

.result.draw {
    color: #555;
}

.result.loss {
    color: #a01c1c;
}

/* =========================================
   回転アニメーション
========================================= */

.card-frame.revealing img {
    animation: spin 0.14s linear 5.15;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(720deg);
    }
}

.card-frame.revealing.reverse img {
    animation-name: spinReverse;
}

@keyframes spinReverse {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(900deg);
    }
}

.card-frame.final-reverse img {
    transform: rotate(180deg);
}

/* =========================================
   スマートフォン
========================================= */

@media (max-width: 700px) {

    header {
        padding: 14px 8px;
    }

    h1 {
        font-size: 26px;
    }

    header p {
        font-size: 13px;
    }

    main {
        padding: 8px;
    }

    .panel {
        padding: 8px;
    }

    button {
        font-size: 30px;
        padding: 16px 28px;
    }

    /*
       13枚を3列
    */
    .board {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));

        gap: 12px;
        width: 100%;
    }

    .slot {
        width: 100%;
    }

    .card-frame {
        width: 100%;
        height: auto;
        aspect-ratio: 0.58;
    }

    .card-name {
        font-size: 16px;
        min-height: 22px;
    }

    .orientation {
        font-size: 14px;
    }

    /*
       勝・負・分を大きく太く
    */
    .result {
        font-size: 30px;
        font-weight: 900;
    }
}

/* =========================================
   非常に小さいスマートフォン
========================================= */

@media (max-width: 380px) {

    .board {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 10px;
    }

    .result {
        font-size: 28px;
    }

    button {
        font-size: 26px;
    }
}
</style>
</head>

<body>

<header>
    <h1>SHIN-TAROTOTO</h1>
    <p>13枚のタロットカードから勝・負・分を導きます</p>
</header>

<main>

<section class="panel">

    <div class="controls">
        <button id="drawBtn">カードを引く</button>
    </div>

    <div id="status" class="status">
        「カードを引く」を押してください。
    </div>

</section>


<section class="panel">

    <div id="board" class="board"></div>

</section>

</main>


<script>

/* =====================================================
   22枚の大アルカナ
===================================================== */

const cards = [

    {
        key:"the_fool",
        name:"愚者",
        num:0,
        file:"https://commons.wikimedia.org/wiki/Special:Redirect/file/The%20Fool%20%28Rider-Waite%20Smith%20tarot%20deck%29.png"
    },

    {
        key:"magician",
        name:"魔術師",
        num:1,
        file:"images/image3.jpeg"
    },

    {
        key:"the_high_priestess",
        name:"女教皇",
        num:2,
        file:"https://commons.wikimedia.org/wiki/Special:Redirect/file/The%20High%20Priestess%20%28Rider-Waite%20Smith%20tarot%20deck%29.png"
    },

    {
        key:"the_empress",
        name:"女帝",
        num:3,
        file:"images/image8.jpeg"
    },

    {
        key:"the_emperor",
        name:"皇帝",
        num:4,
        file:"images/image11.jpeg"
    },

    {
        key:"the_hierophant",
        name:"教皇",
        num:5,
        file:"images/image7.jpeg"
    },

    {
        key:"the_lovers",
        name:"恋人たち",
        num:6,
        file:"images/image4.jpeg"
    },

    {
        key:"the_chariot",
        name:"戦車",
        num:7,
        file:"https://commons.wikimedia.org/wiki/Special:Redirect/file/The%20Chariot%20%28Rider-Waite%20Smith%20tarot%20deck%29.png"
    },

    {
        key:"strength",
        name:"力",
        num:8,
        file:"images/image10.jpeg"
    },

    {
        key:"the_hermit",
        name:"隠者",
        num:9,
        file:"images/image6.jpeg"
    },

    {
        key:"wheel_of_fortune",
        name:"運命の輪",
        num:10,
        file:"images/image5.jpeg"
    },

    {
        key:"justice",
        name:"正義",
        num:11,
        file:"images/image12.jpeg"
    },

    {
        key:"the_hanged_man",
        name:"吊るされた男",
        num:12,
        file:"images/image1.jpeg"
    },

    {
        key:"death",
        name:"死神",
        num:13,
        file:"images/death.jpeg.jpg"
    },

    {
        key:"temperance",
        name:"節制",
        num:14,
        file:"images/image13.jpeg"
    },

    {
        key:"the_devil",
        name:"悪魔",
        num:15,
        file:"images/image2.jpeg"
    },

    {
        key:"the_tower",
        name:"塔",
        num:16,
        file:"https://commons.wikimedia.org/wiki/Special:Redirect/file/The%20Tower%20%28Rider-Waite%20Smith%20tarot%20deck%29.png"
    },

    {
        key:"the_star",
        name:"星",
        num:17,
        file:"https://commons.wikimedia.org/wiki/Special:Redirect/file/The%20Star%20%28Rider-Waite%20Smith%20tarot%20deck%29.png"
    },

    {
        key:"the_moon",
        name:"月",
        num:18,
        file:"https://commons.wikimedia.org/wiki/Special:Redirect/file/The%20Moon%20%28Rider-Waite%20Smith%20tarot%20deck%29.png"
    },

    {
        key:"the_sun",
        name:"太陽",
        num:19,
        file:"https://commons.wikimedia.org/wiki/Special:Redirect/file/The%20Sun%20%28Rider-Waite%20Smith%20tarot%20deck%29.png"
    },

    {
        key:"judgement",
        name:"審判",
        num:20,
        file:"images/judgement.jpeg.jpg"
    },

    {
        key:"the_world",
        name:"世界",
        num:21,
        file:"images/image9.jpeg"
    }

];


/* =====================================================
   VBAと同じ基本判定
===================================================== */

function getCardBaseEval(cardName) {

    const win = [

        "the_sun",
        "the_world",
        "strength",
        "the_chariot",
        "wheel_of_fortune",
        "the_fool",
        "the_empress",
        "the_emperor"

    ];

    const loss = [

        "the_moon",
        "the_hanged_man",
        "death",
        "the_tower",
        "the_devil",
        "magician",
        "the_hermit"

    ];

    if (win.includes(cardName)) {
        return 1;
    }

    if (loss.includes(cardName)) {
        return 2;
    }

    return 0;
}


/* =====================================================
   VBAと同じ正位置・逆位置の判定
===================================================== */

function getFinalEval(baseEval, reversed) {

    if (reversed) {

        if (baseEval === 0) {
            return 1;
        }

        return 0;
    }

    return baseEval;
}


/* =====================================================
   1・0・2 → 表示文字
===================================================== */

function resultText(value) {

    if (value === 1) {
        return {
            word:"勝",
            cls:"win"
        };
    }

    if (value === 2) {
        return {
            word:"負",
            cls:"loss"
        };
    }

    return {
        word:"分",
        cls:"draw"
    };
}


/* =====================================================
   シャッフル
===================================================== */

function shuffle(array) {

    const a = [...array];

    for (
        let i = a.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            a[i],
            a[j]
        ] = [
            a[j],
            a[i]
        ];
    }

    return a;
}


/* =====================================================
   画面
===================================================== */

const board =
    document.getElementById("board");

const statusEl =
    document.getElementById("status");

const drawBtn =
    document.getElementById("drawBtn");


/* =====================================================
   13枚の枠を作る
===================================================== */

function buildBoard() {

    board.innerHTML = "";

    for (let i = 0; i < 13; i++) {

        const slot =
            document.createElement("div");

        slot.className = "slot";

        slot.innerHTML = `

            <div class="match">
                第${i + 1}試合
            </div>

            <div class="card-frame back">
                <img alt="">
            </div>

            <div class="card-name">
                —
            </div>

            <div class="orientation">
                —
            </div>

            <div class="result"></div>

        `;

        board.appendChild(slot);
    }
}


/* =====================================================
   待ち時間
===================================================== */

function wait(ms) {

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );
}


/* =====================================================
   13枚を引く
===================================================== */

async function drawCards() {

    drawBtn.disabled = true;

    buildBoard();

    statusEl.textContent =
        "13枚のカードをシャッフルしています……";


    /*
       22枚から重複なしで13枚
    */

    const selected =
        shuffle(cards).slice(0, 13);


    for (
        let i = 0;
        i < 13;
        i++
    ) {

        const card =
            selected[i];

        const slot =
            board.children[i];

        const frame =
            slot.querySelector(
                ".card-frame"
            );

        const img =
            frame.querySelector("img");


        /*
           正位置・逆位置
        */

        const reversed =
            Math.random() < 0.5;


        /*
           基本判定
        */

        const baseEval =
            getCardBaseEval(
                card.key
            );


        /*
           最終判定
        */

        const finalEval =
            getFinalEval(
                baseEval,
                reversed
            );


        /*
           勝・負・分
        */

        const result =
            resultText(
                finalEval
            );


        /*
           カード画像
        */

        img.src = card.file;

        img.alt = card.name;


        /*
           画像エラー時
        */

        img.onerror = function() {

            img.onerror = null;

            img.src =
                "https://commons.wikimedia.org/wiki/Special:Redirect/file/Rider-Waite_Major_Arcana_full.png";
        };


        /*
           表示
        */

        frame.classList.remove("back");

        frame.classList.add("revealing");


        if (reversed) {

            frame.classList.add(
                "reverse"
            );
        }


        /*
           カード名
        */

        slot.querySelector(
            ".card-name"
        ).textContent =
            card.name;


        /*
           正位置・逆位置
        */

        slot.querySelector(
            ".orientation"
        ).textContent =
            reversed
                ? "逆位置"
                : "正位置";


        /*
           回転
        */

        await wait(140);


        frame.classList.remove(
            "revealing"
        );


        if (reversed) {

            frame.classList.add(
                "final-reverse"
            );
        }


        /*
           ★ここが重要
           
           表示するのは
           
           勝（1）
           分（0）
           負（2）
           
           だけです。
           
           「判定：」という文字は
           このプログラムのどこにもありません。
        */

        const resultEl =
            slot.querySelector(
                ".result"
            );

        resultEl.textContent =
            `${result.word}（${finalEval}）`;

        resultEl.classList.add(
            result.cls
        );
    }


    statusEl.textContent =
        "13枚のカードの結果が出ました。";

    drawBtn.disabled = false;
}


/* =====================================================
   ボタン
===================================================== */

drawBtn.addEventListener(
    "click",
    drawCards
);


/* =====================================================
   初期画面
===================================================== */

buildBoard();

</script>

</body>
</html>
