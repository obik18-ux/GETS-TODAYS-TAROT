<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHIN-TAROTOTO 13枚カード・スマホ版</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-width: 0;
    background: #f5f5f5;
    font-family:
        "Yu Gothic",
        "Meiryo",
        sans-serif;
}

* {
    box-sizing: border-box;
}

/* iframe */
#tarotFrame {
    display: block;
    width: 100%;
    border: none;
    overflow: hidden;
}

/* スマホ画面全体 */
.mobile-container {
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
    padding: 10px;
}

/* カード表示部分 */
.card-area {
    width: 100%;
    overflow: hidden;
}

/* 元ページをスマホ用に表示 */
#tarotFrame {
    background: #f5f5f5;
}

/* 小さな画面 */
@media (max-width: 600px) {

    .mobile-container {
        padding: 5px;
    }

}

/* とても小さいスマホ */
@media (max-width: 380px) {

    .mobile-container {
        padding: 3px;
    }

}
</style>
</head>

<body>

<div class="mobile-container">

    <div class="card-area">
        <iframe
            id="tarotFrame"
            src="13%E6%9E%9A%E3%82%AB%E3%83%BC%E3%83%89%E8%A1%A8%E7%A4%BA%E7%89%88.html"
            scrolling="no">
        </iframe>
    </div>

</div>


<script>

/* =========================================
   iframe内の13枚カード表示をスマホ用に調整
========================================= */

const frame = document.getElementById("tarotFrame");


/* iframe読み込み後 */
frame.addEventListener("load", function () {

    const doc = frame.contentDocument || frame.contentWindow.document;

    if (!doc) return;


    /* =====================================
       スマホ用CSSをiframe内部へ追加
    ===================================== */

    const style = doc.createElement("style");

    style.textContent = `

        html,
        body {
            width: 100% !important;
            min-width: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow-x: hidden !important;
        }

        main {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            padding: 10px !important;
            margin: 0 !important;
        }

        .panel {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            padding: 10px !important;
            margin: 0 !important;
        }

        /*
         * 13枚カードを3列表示
         */
        #board,
        .board {
            display: grid !important;
            grid-template-columns:
                repeat(3, minmax(0, 1fr)) !important;

            width: 100% !important;
            min-width: 0 !important;
            max-width: 100% !important;

            gap: 12px !important;
            margin: 0 auto !important;
        }

        /*
         * カード枠
         */
        .card,
        .card-item,
        .card-box,
        .card-frame {
            width: 100% !important;
            min-width: 0 !important;
            max-width: 100% !important;
        }

        /*
         * カード画像
         */
        .card img,
        .card-item img,
        .card-box img,
        .card-frame img {
            width: 100% !important;
            height: auto !important;
            max-width: 100% !important;
            display: block !important;
        }

        /*
         * カード名
         */
        .card-name,
        .name {
            font-size: 16px !important;
            font-weight: bold !important;
            text-align: center !important;
        }

        /*
         * 正位置・逆位置
         */
        .orientation {
            font-size: 15px !important;
            text-align: center !important;
        }

        /*
         * 勝・負・分
         */
        .result,
        .result.win,
        .result.draw,
        .result.loss {
            font-size: 30px !important;
            line-height: 1.3 !important;
            font-weight: 900 !important;
            text-align: center !important;
            margin-top: 8px !important;
            margin-bottom: 8px !important;
        }

        /*
         * 「カードを引く」ボタン
         */
        button {
            font-size: 28px !important;
            font-weight: 900 !important;
            padding: 14px 24px !important;
            line-height: 1.3 !important;
        }

        /*
         * 判定：0
         * 判定：1
         * 判定：2
         */
        .judgment-hidden {
            display: none !important;
        }


        /*
         * 画面幅が380px以下なら2列
         */
        @media (max-width: 380px) {

            #board,
            .board {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr)) !important;

                gap: 10px !important;
            }

            .result,
            .result.win,
            .result.draw,
            .result.loss {
                font-size: 27px !important;
            }

            button {
                font-size: 25px !important;
            }
        }

    `;

    doc.head.appendChild(style);


    /* =========================================
       「判定：0」「判定：1」「判定：2」を削除
    ========================================= */

    function cleanJudgment() {

        /* 要素そのものを確認 */
        const elements = doc.querySelectorAll(
            "#board *, .board *, body *"
        );

        elements.forEach(function(el) {

            const text =
                (el.textContent || "").trim();

            if (
                text === "判定：0" ||
                text === "判定：1" ||
                text === "判定：2" ||
                text === "判定:0" ||
                text === "判定:1" ||
                text === "判定:2"
            ) {
                el.classList.add("judgment-hidden");
            }

        });


        /* =====================================
           テキストノードの中に
           「判定：0」などが入っている場合
        ===================================== */

        const walker = doc.createTreeWalker(
            doc.body,
            NodeFilter.SHOW_TEXT
        );

        const nodes = [];

        let node;

        while (node = walker.nextNode()) {
            nodes.push(node);
        }


        nodes.forEach(function(textNode) {

            let text = textNode.nodeValue;

            if (!text) return;


            /*
             * 判定：0
             * 判定：1
             * 判定：2
             */
            text = text.replace(
                /判定\s*[：:]\s*[012]/g,
                ""
            );


            /*
             * 判定 0
             * 判定 1
             * 判定 2
             */
            text = text.replace(
                /判定\s+[012]/g,
                ""
            );


            textNode.nodeValue = text;

        });

    }


    /* 最初に実行 */
    cleanJudgment();


    /* =========================================
       「カードを引く」を押したあとにも
       判定表示が復活しないよう監視
    ========================================= */

    const observer = new MutationObserver(function() {

        cleanJudgment();

        resizeFrame();

    });


    observer.observe(doc.body, {

        childList: true,
        subtree: true,
        characterData: true

    });


    /* =========================================
       iframeの高さを自動調整
    ========================================= */

    function resizeFrame() {

        try {

            const height =
                Math.max(
                    doc.body.scrollHeight,
                    doc.documentElement.scrollHeight
                );

            frame.style.height =
                (height + 30) + "px";

        } catch (e) {

        }

    }


    /* 初回 */
    resizeFrame();


    /* 少し待って再調整 */
    setTimeout(function() {

        cleanJudgment();
        resizeFrame();

    }, 500);


    setTimeout(function() {

        cleanJudgment();
        resizeFrame();

    }, 1500);


    setTimeout(function() {

        cleanJudgment();
        resizeFrame();

    }, 3000);

});

</script>

</body>
</html>
